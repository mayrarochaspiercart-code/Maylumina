<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Marca que o JavaScript está vivo ANTES da primeira pintura. Só o que
       estiver sob `.js` pode se esconder à espera de animação; sem JS a
       página aparece inteira. -->
  <script>document.documentElement.classList.add('js');</script>
<title>Página não encontrada — MayLumina</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EAE0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Tipografia hospedada no próprio projeto: sem terceiro no caminho
     crítico e sem entregar o IP do visitante ao Google. Ver
     assets/css/fontes.css. -->
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/cormorant-garamond-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/quicksand-latin.woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/fontes.css">
<link rel="stylesheet" href="/assets/css/maylumina.css">
</head>
<body>
<main id="conteudo" class="tipo-spread" style="--ts-a:var(--pink-luz); --ts-b:var(--roxo-luz); --ts-c:var(--turquesa-luz)">
  <div class="tipo-spread__fundo" aria-hidden="true"></div>
  <div class="limite" style="text-align:center">
    <p class="olho">Erro 404</p>
    <h1 class="tipo-spread__palavra">Esta página <br>não tem luz.</h1>
    <p class="tipo-spread__nota">O endereço que você procurava não existe por aqui.</p>
    <p style="margin-top:2.6rem">
      <a class="botao" href="/">Voltar ao universo <span class="botao__seta" aria-hidden="true">→</span></a>
    </p>
  </div>
</main>
</body>
</html>
