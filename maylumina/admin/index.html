<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maylumina — Painel Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/css/fontes.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --creme: #F2EAE0;
      --pink: #E91E8C;
      --roxo: #8B4F9F;
      --turquesa: #00CCA8;
      --laranja: #F0944E;
      --texto: #3A2F2F;
      --texto-light: #7A6B6B;
      --bg: #FAF8F5;
      --card: #FFFFFF;
      --border: #E8E2DA;
      --danger: #E85C5C;
      --success: #00CCA8;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg);
      color: var(--texto);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .login-overlay.hidden { display: none; }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }

    .login-box h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--pink);
    }

    .login-box p {
      font-size: 0.85rem;
      color: var(--texto-light);
      margin-bottom: 2rem;
    }

    .login-box input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .login-box input:focus { border-color: var(--pink); }

    .login-error {
      color: var(--danger);
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary { background: var(--pink); color: white; }
    .btn-primary:hover { background: var(--roxo); }
    .btn-secondary { background: var(--creme); color: var(--texto); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.8; }
    .btn-success { background: var(--success); color: white; }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
    .btn-full { width: 100%; justify-content: center; }

    /* ── LAYOUT ── */
    .admin-container { display: none; }
    .admin-container.active { display: block; }

    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--pink);
    }

    .topbar-actions { display: flex; gap: 0.5rem; align-items: center; }

    .tabs {
      display: flex;
      gap: 0;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
    }

    .tab {
      padding: 0.9rem 1.5rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--texto-light);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab.active {
      color: var(--pink);
      border-bottom-color: var(--pink);
    }

    .tab:hover { color: var(--texto); }

    .page { display: none; padding: 2rem; max-width: 1100px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── CARDS / TABLE ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .card-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: box-shadow 0.3s;
    }

    .product-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }

    .product-card__img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--creme);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--texto-light);
      font-size: 0.8rem;
    }

    .product-card__img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-card__body { padding: 1rem; }

    .product-card__name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .product-card__price {
      color: var(--pink);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-card__actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }

    .product-card__status {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .status-active { background: rgba(0,204,168,0.1); color: var(--success); }
    .status-inactive { background: rgba(232,92,92,0.1); color: var(--danger); }

    /* ── FORMS ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      display: none;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card);
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--pink);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--texto-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--pink);
    }

    .form-group textarea { min-height: 80px; resize: vertical; }

    .form-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    /* ── ORDERS ── */
    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 0.8rem;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .order-id {
      font-size: 0.75rem;
      color: var(--texto-light);
      font-family: monospace;
    }

    .order-status {
      padding: 0.25rem 0.8rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .order-status.pendente { background: #FFF3E0; color: #E65100; }
    .order-status.pago { background: #E0F2F1; color: #00695C; }
    .order-status.enviado { background: #E3F2FD; color: #1565C0; }
    .order-status.entregue { background: #E8F5E9; color: #2E7D32; }
    .order-status.cancelado { background: #FFEBEE; color: #C62828; }

    .order-client {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .order-detail {
      font-size: 0.82rem;
      color: var(--texto-light);
      line-height: 1.5;
    }

    .order-total {
      font-weight: 600;
      color: var(--pink);
      font-size: 1.05rem;
      margin-top: 0.6rem;
    }

    .order-actions {
      margin-top: 0.8rem;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--texto);
      color: var(--creme);
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--texto-light);
    }

    .empty-state p { font-size: 0.95rem; margin-bottom: 1.5rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .topbar { padding: 0.8rem 1rem; }
      .tabs { padding: 0 1rem; }
      .tab { padding: 0.7rem 1rem; font-size: 0.8rem; }
      .page { padding: 1rem; }
      .products-grid { grid-template-columns: 1fr; }
      .modal { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- ═══ LOGIN ═══ -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h1>Maylumina</h1>
      <p>Painel administrativo</p>
      <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username" autofocus>
      <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">
      <p class="login-error" id="loginError">E-mail ou senha incorretos.</p>
      <button class="btn btn-primary btn-full" id="loginBotao" onclick="doLogin()">Entrar</button>
    </div>
  </div>

  <!-- ═══ ADMIN PANEL ═══ -->
  <div class="admin-container" id="adminContainer">
    <div class="topbar">
      <h1>✦ Maylumina Admin</h1>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-small" onclick="window.open('../index.html','_blank')">Ver site</button>
        <button class="btn btn-secondary btn-small" onclick="doLogout()">Sair</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('produtos')">Produtos</button>
      <button class="tab" onclick="switchTab('pedidos')">Pedidos</button>
    </div>

    <!-- ── PRODUTOS ── -->
    <div class="page active" id="page-produtos">
      <div class="card-header">
        <h2>Produtos</h2>
        <button class="btn btn-primary" onclick="openProductModal()">+ Novo produto</button>
      </div>
      <div class="products-grid" id="productsGrid">
        <div class="empty-state">
          <p>Nenhum produto cadastrado ainda.</p>
          <button class="btn btn-primary" onclick="openProductModal()">Adicionar primeiro produto</button>
        </div>
      </div>
    </div>

    <!-- ── PEDIDOS ── -->
    <div class="page" id="page-pedidos">
      <div class="card-header">
        <h2>Pedidos</h2>
        <button class="btn btn-secondary btn-small" onclick="loadOrders()">Atualizar</button>
      </div>
      <div id="ordersContainer">
        <div class="empty-state">
          <p>Nenhum pedido recebido ainda.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ MODAL: Produto ═══ -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h2 id="modalTitle">Novo produto</h2>
      <input type="hidden" id="productId">

      <div class="form-group">
        <label>Nome do produto</label>
        <input type="text" id="prodNome" placeholder="Ex: Óleo Iluminador Camaleão">
      </div>

      <div class="form-group">
        <label>Descrição</label>
        <textarea id="prodDesc" placeholder="Descreva o produto, ingredientes, modo de uso..."></textarea>
      </div>

      <div class="form-group">
        <label>Preço (R$)</label>
        <input type="number" id="prodPreco" step="0.01" min="0" placeholder="49.90">
      </div>

      <div class="form-group">
        <label>Categoria</label>
        <select id="prodCategoria">
          <option value="body-care">Body Care</option>
          <option value="oleos">Óleos Essenciais</option>
          <option value="maquiagem">Maquiagem</option>
          <option value="brilho">Brilho</option>
          <option value="kits">Kits</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="form-group">
        <label>URL da imagem</label>
        <input type="url" id="prodImagem" placeholder="Cole o link da imagem do produto">
        <small style="color:var(--texto-light);font-size:0.72rem;">
          Suba a imagem no <a href="https://imgbb.com" target="_blank">imgbb.com</a> (grátis) e cole o link direto aqui.
        </small>
      </div>

      <div class="form-group">
        <label>URL do vídeo curto (opcional)</label>
        <input type="url" id="prodVideo" placeholder="Link do vídeo artístico do produto">
      </div>

      <div class="form-group" style="display:flex;gap:1rem;">
        <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
          <input type="checkbox" id="prodAtivo" checked> Ativo (visível no site)
        </label>
        <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
          <input type="checkbox" id="prodDestaque"> Destaque
        </label>
      </div>

      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeProductModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveProduct()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div class="toast" id="toast"></div>

  <script>
    // ═══════════════════════════════════════
    // SUPABASE CONFIG
    // A chave anon é pública por definição — ela identifica o projeto, não
    // autoriza nada. Toda autorização é decidida no banco, por RLS, a partir
    // do usuário autenticado (ver docs/supabase/001-auth-e-rls.sql).
    // ═══════════════════════════════════════
    const SUPABASE_URL = 'https://rkwlumnrlzmusdccwvxd.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrd2x1bW5ybHptdXNkY2N3dnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMzEyMDMsImV4cCI6MjA5ODcwNzIwM30.k4n-WiEwXCENCX0ItiZoH-Z1BwYy1429AM8GYOv6_MM';

    // ═══════════════════════════════════════
    // SESSÃO (Supabase Auth)
    // O que autoriza uma escrita é o access token deste usuário, não um
    // booleano guardado no navegador. Se o token não valer, o banco recusa.
    // ═══════════════════════════════════════
    const CHAVE_SESSAO = 'ml_sessao';
    let sessao = null;

    function lerSessao() {
      try {
        const bruto = sessionStorage.getItem(CHAVE_SESSAO);
        return bruto ? JSON.parse(bruto) : null;
      } catch (e) {
        return null;
      }
    }

    function gravarSessao(s) {
      sessao = s;
      if (s) sessionStorage.setItem(CHAVE_SESSAO, JSON.stringify(s));
      else sessionStorage.removeItem(CHAVE_SESSAO);
    }

    async function authFetch(rota, corpo) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/${rota}`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      });
      const texto = await res.text();
      const dados = texto ? JSON.parse(texto) : null;
      if (!res.ok) {
        const erro = new Error((dados && (dados.error_description || dados.msg || dados.message)) || 'Falha de autenticação');
        erro.status = res.status;
        throw erro;
      }
      return dados;
    }

    function guardarToken(dados) {
      gravarSessao({
        access_token: dados.access_token,
        refresh_token: dados.refresh_token,
        expira_em: Date.now() + ((dados.expires_in || 3600) * 1000) - 60000,
        email: dados.user && dados.user.email
      });
    }

    async function renovarSessao() {
      const atual = sessao || lerSessao();
      if (!atual || !atual.refresh_token) return false;
      try {
        const dados = await authFetch('token?grant_type=refresh_token', { refresh_token: atual.refresh_token });
        guardarToken(dados);
        return true;
      } catch (e) {
        gravarSessao(null);
        return false;
      }
    }

    async function tokenValido() {
      const atual = sessao || lerSessao();
      if (!atual) return null;
      sessao = atual;
      if (Date.now() >= atual.expira_em) {
        const ok = await renovarSessao();
        if (!ok) return null;
      }
      return sessao.access_token;
    }

    // ═══════════════════════════════════════
    // SUPABASE REST
    // ═══════════════════════════════════════
    async function supaFetch(endpoint, options = {}) {
      const token = await tokenValido();
      const enviar = async (bearer) => fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${bearer}`,
          'Content-Type': 'application/json',
          'Prefer': options.prefer || 'return=representation',
          ...options.headers
        },
        method: options.method || 'GET',
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      let res = await enviar(token || SUPABASE_KEY);

      // Token expirado no meio do caminho: uma tentativa de renovar, e só.
      if (res.status === 401 && token) {
        const ok = await renovarSessao();
        if (ok) res = await enviar(sessao.access_token);
      }

      if (res.status === 401 || res.status === 403) {
        if (token) encerrarSessao('Sua sessão expirou ou este usuário não tem permissão.');
        const err = new Error('Não autorizado');
        err.status = res.status;
        throw err;
      }

      if (!res.ok) {
        const texto = await res.text();
        throw new Error(texto);
      }
      const texto = await res.text();
      return texto ? JSON.parse(texto) : null;
    }

    // ═══════════════════════════════════════
    // LOGIN / LOGOUT
    // ═══════════════════════════════════════
    function mostrarErroLogin(mensagem) {
      const alvo = document.getElementById('loginError');
      alvo.textContent = mensagem;
      alvo.style.display = 'block';
    }

    function abrirPainel() {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('adminContainer').classList.add('active');
      loadProducts();
    }

    function encerrarSessao(mensagem) {
      gravarSessao(null);
      if (mensagem) sessionStorage.setItem('ml_aviso', mensagem);
      location.reload();
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pwd = document.getElementById('loginPassword').value;
      const botao = document.getElementById('loginBotao');
      document.getElementById('loginError').style.display = 'none';

      if (!email || !pwd) {
        mostrarErroLogin('Preencha e-mail e senha.');
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Entrando…';
      try {
        const dados = await authFetch('token?grant_type=password', { email, password: pwd });
        guardarToken(dados);
        abrirPainel();
      } catch (e) {
        gravarSessao(null);
        mostrarErroLogin(e.status ? 'E-mail ou senha incorretos.' : 'Erro de conexão.');
      } finally {
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    }

    async function doLogout() {
      const token = sessao && sessao.access_token;
      if (token) {
        try {
          await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
          });
        } catch (e) { /* o token some daqui de qualquer forma */ }
      }
      encerrarSessao();
    }

    // Retoma a sessão desta aba, se ainda houver uma válida.
    document.addEventListener('DOMContentLoaded', async () => {
      const aviso = sessionStorage.getItem('ml_aviso');
      if (aviso) {
        sessionStorage.removeItem('ml_aviso');
        mostrarErroLogin(aviso);
      }
      if (await tokenValido()) abrirPainel();
    });

    // Enter em qualquer campo do login
    ['loginEmail', 'loginPassword'].forEach((id) => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doLogin();
      });
    });

    // ═══════════════════════════════════════
    // TABS
    // ═══════════════════════════════════════
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`page-${tab}`).classList.add('active');
      if (tab === 'pedidos') loadOrders();
    }

    // ═══════════════════════════════════════
    // PRODUTOS
    // ═══════════════════════════════════════
    let products = [];

    async function loadProducts() {
      try {
        products = await supaFetch('produtos?select=*&order=ordem.asc,created_at.desc');
        renderProducts();
      } catch (e) {
        showToast('Erro ao carregar produtos');
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      if (!products || products.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <p>Nenhum produto cadastrado ainda.</p>
            <button class="btn btn-primary" onclick="openProductModal()">Adicionar primeiro produto</button>
          </div>`;
        return;
      }
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-card__img">
            ${p.imagem_url 
              ? `<img src="${p.imagem_url}" alt="${p.nome}" onerror="this.parentElement.innerHTML='Imagem não encontrada'">`
              : 'Sem imagem'}
          </div>
          <div class="product-card__body">
            <p class="product-card__name">${p.nome}</p>
            <p class="product-card__price">R$ ${Number(p.preco).toFixed(2)}</p>
            <span class="product-card__status ${p.ativo ? 'status-active' : 'status-inactive'}">
              ${p.ativo ? 'Ativo' : 'Inativo'}
            </span>
            ${p.destaque ? '<span class="product-card__status status-active" style="margin-left:0.3rem;">★ Destaque</span>' : ''}
            <div class="product-card__actions">
              <button class="btn btn-secondary btn-small" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Editar</button>
              <button class="btn btn-danger btn-small" onclick="deleteProduct('${p.id}')">Excluir</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openProductModal(product = null) {
      document.getElementById('modalTitle').textContent = product ? 'Editar produto' : 'Novo produto';
      document.getElementById('productId').value = product ? product.id : '';
      document.getElementById('prodNome').value = product ? product.nome : '';
      document.getElementById('prodDesc').value = product ? (product.descricao || '') : '';
      document.getElementById('prodPreco').value = product ? product.preco : '';
      document.getElementById('prodCategoria').value = product ? (product.categoria || 'body-care') : 'body-care';
      document.getElementById('prodImagem').value = product ? (product.imagem_url || '') : '';
      document.getElementById('prodVideo').value = product ? (product.video_url || '') : '';
      document.getElementById('prodAtivo').checked = product ? product.ativo : true;
      document.getElementById('prodDestaque').checked = product ? product.destaque : false;
      document.getElementById('productModal').classList.add('open');
    }

    function editProduct(product) {
      openProductModal(product);
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('open');
    }

    async function saveProduct() {
      const id = document.getElementById('productId').value;
      const data = {
        nome: document.getElementById('prodNome').value.trim(),
        descricao: document.getElementById('prodDesc').value.trim(),
        preco: parseFloat(document.getElementById('prodPreco').value) || 0,
        categoria: document.getElementById('prodCategoria').value,
        imagem_url: document.getElementById('prodImagem').value.trim() || null,
        video_url: document.getElementById('prodVideo').value.trim() || null,
        ativo: document.getElementById('prodAtivo').checked,
        destaque: document.getElementById('prodDestaque').checked,
        updated_at: new Date().toISOString()
      };

      if (!data.nome) { showToast('Nome é obrigatório'); return; }
      if (!data.preco) { showToast('Preço é obrigatório'); return; }

      try {
        if (id) {
          await supaFetch(`produtos?id=eq.${id}`, { method: 'PATCH', body: data });
          showToast('Produto atualizado');
        } else {
          await supaFetch('produtos', { method: 'POST', body: data });
          showToast('Produto criado');
        }
        closeProductModal();
        loadProducts();
      } catch (e) {
        showToast('Erro ao salvar: ' + e.message);
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Tem certeza que quer excluir este produto?')) return;
      try {
        await supaFetch(`produtos?id=eq.${id}`, { method: 'DELETE' });
        showToast('Produto excluído');
        loadProducts();
      } catch (e) {
        showToast('Erro ao excluir');
      }
    }

    // ═══════════════════════════════════════
    // PEDIDOS
    // ═══════════════════════════════════════
    async function loadOrders() {
      try {
        const orders = await supaFetch('pedidos?select=*,pedido_itens(*)&order=created_at.desc');
        renderOrders(orders);
      } catch (e) {
        showToast('Erro ao carregar pedidos');
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      if (!orders || orders.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>Nenhum pedido recebido ainda.</p></div>';
        return;
      }
      container.innerHTML = orders.map(o => {
        const date = new Date(o.created_at).toLocaleDateString('pt-BR', { 
          day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' 
        });
        const items = o.pedido_itens ? o.pedido_itens.map(i => 
          `${i.quantidade}x ${i.produto_nome} (R$ ${Number(i.preco_unitario).toFixed(2)})`
        ).join('<br>') : 'Sem itens';

        return `
        <div class="order-card">
          <div class="order-header">
            <div>
              <p class="order-client">${o.cliente_nome}</p>
              <p class="order-id">${o.id.slice(0,8)}… · ${date}</p>
            </div>
            <span class="order-status ${o.status}">${o.status}</span>
          </div>
          <div class="order-detail">
            <strong>Itens:</strong><br>${items}<br><br>
            <strong>Telefone:</strong> ${o.cliente_telefone}<br>
            ${o.cliente_email ? `<strong>Email:</strong> ${o.cliente_email}<br>` : ''}
            <strong>Endereço:</strong> ${o.endereco_rua}, ${o.endereco_numero}
            ${o.endereco_complemento ? ` - ${o.endereco_complemento}` : ''}<br>
            ${o.endereco_bairro}, ${o.endereco_cidade} - ${o.endereco_estado}<br>
            CEP: ${o.endereco_cep}<br>
            ${o.frete_tipo ? `<strong>Frete:</strong> ${o.frete_tipo} - R$ ${Number(o.frete_valor).toFixed(2)} (${o.frete_prazo || ''})` : ''}
          </div>
          <p class="order-total">Total: R$ ${Number(o.total).toFixed(2)}</p>
          <div class="order-actions">
            <button class="btn btn-small ${o.status === 'pendente' ? 'btn-success' : 'btn-secondary'}" 
              onclick="updateOrderStatus('${o.id}', 'pago')">Marcar pago</button>
            <button class="btn btn-small ${o.status === 'pago' ? 'btn-primary' : 'btn-secondary'}" 
              onclick="updateOrderStatus('${o.id}', 'enviado')">Marcar enviado</button>
            <button class="btn btn-small btn-secondary" 
              onclick="updateOrderStatus('${o.id}', 'entregue')">Entregue</button>
            <button class="btn btn-small btn-danger" 
              onclick="updateOrderStatus('${o.id}', 'cancelado')">Cancelar</button>
          </div>
        </div>`;
      }).join('');
    }

    async function updateOrderStatus(id, status) {
      try {
        await supaFetch(`pedidos?id=eq.${id}`, { 
          method: 'PATCH', 
          body: { status, updated_at: new Date().toISOString() }
        });
        showToast(`Pedido marcado como: ${status}`);
        loadOrders();
      } catch (e) {
        showToast('Erro ao atualizar pedido');
      }
    }

    // ═══════════════════════════════════════
    // TOAST
    // ═══════════════════════════════════════
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

  </script>
</body>
</html>
